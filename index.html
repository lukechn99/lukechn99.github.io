<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/death-star.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lukechn99.github.io</title>
    <script>
      // Apply the saved light/dark choice before first paint (Mantine's storage key).
      try {
        var scheme = localStorage.getItem('mantine-color-scheme-value');
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
